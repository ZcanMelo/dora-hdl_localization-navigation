nodes: 
  - id: imu 
    custom:
      source: build/HWT9053modbus/imu_driver_node
      inputs:
        tick: dora/timer/millis/50
      outputs:
        - imu_msg

  - id: lidar 
    custom:
      source: build/rslidar_driver/rslidar_driver
      inputs:
        tick: dora/timer/millis/100
      outputs:
        - pointcloud
      envs: 
        ONLINE_LIDAR: 0       #   0 is pcap    1 is online lidar 
        PCAP_PATH: /home/nvidia/dora_project/pcap/yewai.pcap
        LIDAR_MSOP_PORT: 6699
        LIDAR_DIFOP_PORT: 7788
        LIDAR_TYPE: RSHELIOS_16

  - id: hdl_localization
    custom:
      source: build/dora-hdl_localization/hdl_localization
      inputs: 
        pointcloud: lidar/pointcloud
        imu_msg: imu/imu_msg
      outputs: 
       - cur_pose
      envs: 
        use_imu: 0       #  1 using imu 

  - id: pub_road 
    custom:
      source: build/map/pub_road/pubroad
      inputs:
        tick: dora/timer/millis/200
      outputs:
        - road_lane
        
  - id: road_lane_publisher_node 
    custom:
      source: build/map/road_line_publisher/road_lane_publisher_node
      inputs:
        road_lane: pub_road/road_lane
        cur_pose: hdl_localization/cur_pose
      outputs:
        - cur_pose_all  
            
  - id: task_pub_node 
    custom:
      source: build/planning/mission_planning/task_pub/task_pub_node
      inputs:
        tick: dora/timer/millis/20
      outputs:
        - road_attri_msg
                    
  - id: planning  
    custom:
      source: build/planning/routing_planning/routing_planning_node
      inputs:
        road_lane: pub_road/road_lane   
        cur_pose_all: road_lane_publisher_node/cur_pose_all
        road_attri_msg: task_pub_node/road_attri_msg
      outputs:
        - raw_path  
        - Request

  # - id: lon_control
  #   custom:
  #     source: build/control/vehicle_control/lon_controller/lon_controller_node
  #     inputs:
  #       Request: planning/Request
